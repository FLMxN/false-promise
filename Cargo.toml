[package]
name = "quant"
version = "0.1.0"
edition = "2024"

[dependencies]
yfinance-rs = "0.9.1"
meval = "0.1"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.10"
evalexpr-jit = "0.2.3"
symb_anafis = "0.8.1"
exmex = { version = "0.21.0", features = ["partial"] }
plotters = "0.3"
show-image = "0.14.1"
